name: Run Tests

on:
  push:
    branches: [ master, build ]
  pull_request:
    branches: [ master, build ]
  workflow_call:

jobs:
  test:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable ".[test]"

    - name: Run Python test suite
      run: |
        python -m pytest tests/test_python.py tests/test_streaming.py

  coverage:
    name: Linux Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install coverage dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable ".[test]"

    - name: Run Python tests with coverage
      run: |
        make test COVERAGE=1 PYTHON=python PYTEST_ARGS='tests/test_python.py tests/test_streaming.py'

    - name: Run native tests with coverage
      shell: bash
      run: |
        make test-native-coverage PYTHON=python

    - name: Build combined coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: python-coverage.xml,native-coverage.xml
        badge: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          python-coverage.xml
          native-coverage.xml
        if-no-files-found: error
