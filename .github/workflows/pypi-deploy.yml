
name: CI Build Wheel

on:
  push:
    branches: [master, build]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:

  test:
    uses: ./.github/workflows/test.yml

  build_wheels:
    name: Build binary wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Store binary wheels
        uses: actions/upload-artifact@v4
        with:
          name: binary-wheels-${{matrix.os}}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: python -m pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Store source wheels
        uses: actions/upload-artifact@v4
        with:
          name: source-wheels
          path: dist/*.tar.gz
      - name: Display files
        run: ls -lR


  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]

    steps:
      - name: Get source wheels
        uses: actions/download-artifact@v4
        with:
          name: source-wheels
          path: dist/
      - name: Get binary wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: binary-wheels-*
          merge-multiple: true
      - name: Display files
        run: ls -lR

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.IMCTERMITE_GITHUB_WORKFLOW_PYPI_API_TOKEN }}
